name: Update site release

on:
  workflow_call:
    inputs:
      version:
        description: The exact stable version that was published to npm
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Already published stable version to retry (for example, 0.3.0)
        required: true
        type: string

concurrency:
  group: site-release
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    # Called from the Release workflow on main, or run by hand there to retry a
    # version that is already published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      # The site is built from the commit that was published, so docs that landed
      # on main afterwards wait for the next release. Only this workflow writes the
      # production branch, and every run rebuilds it from that commit, so a retry
      # cannot conflict with anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/@portone/docx-editor@${{ inputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Wait for the published version and build the site
        env:
          SITE_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/site-release.mjs prepare
      - name: Rebuild the production branch for Vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/site-release.mjs publish

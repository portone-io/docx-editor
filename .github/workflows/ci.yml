name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # exportSchemaValidation.test.ts validates exported XML with xmllint.
      # The runner image usually ships it; apt-get update alone costs ~50s, so
      # it only runs as the last resort.
      - run: |
          xmllint --version >/dev/null 2>&1 && exit 0
          sudo apt-get install -y --no-install-recommends libxml2-utils \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:package
      - run: pnpm verify:package

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

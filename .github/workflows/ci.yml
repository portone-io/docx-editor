name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # exportSchemaValidation.test.ts validates exported XML with xmllint.
      # The runner image usually ships it; apt-get update alone costs ~50s, so
      # it only runs as the last resort.
      - run: |
          xmllint --version >/dev/null 2>&1 && exit 0
          sudo apt-get install -y --no-install-recommends libxml2-utils \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package:
    name: package (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # An empty range leaves verify:package on the range the manifest declares
          - react: 19
            range: ""
          - react: 18
            range: "^18"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tarball holds no React of its own, so its contents are checked once
      - if: matrix.react == 19
        run: pnpm test:package
      - run: pnpm verify:package
        env:
          DOCX_EDITOR_REACT_RANGE: ${{ matrix.range }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action pins the zizmor image by digest, so its own pin above fixes
      # the analyzer version too. Findings are reported as diff annotations
      # rather than uploaded to the security tab: the upload step is skipped
      # whenever zizmor exits non-zero, which is exactly when there is
      # something to look at.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/xmllint
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tarball holds no React of its own, so its contents are checked once
      - run: pnpm test:package
      - run: |
          pnpm build
          pnpm pack --pack-destination "${RUNNER_TEMP}"
          echo "DOCX_EDITOR_TARBALL=$(echo "${RUNNER_TEMP}"/*.tgz)" >> "${GITHUB_ENV}"
      # Both majors are verified on this one runner so the suite reads as a
      # single check. Their output would interleave, so each run keeps its own
      # log and both are replayed once they have finished.
      - name: verify the package against each supported React major
        run: |
          verify() {
            DOCX_EDITOR_REACT_RANGE="${2}" pnpm verify:package \
              >"${RUNNER_TEMP}/react-${1}.log" 2>&1
          }
          # An empty range leaves verify:package on the range the manifest declares
          verify 19 "" &
          nineteen=$!
          verify 18 "^18" &
          eighteen=$!
          status=0
          wait "${nineteen}" || status=1
          wait "${eighteen}" || status=1
          for major in 19 18; do
            echo "::group::React ${major}"
            cat "${RUNNER_TEMP}/react-${major}.log"
            echo "::endgroup::"
          done
          exit "${status}"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: 19
            checks: pnpm check
          - react: 18
            checks: pnpm lint && pnpm check:react18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # exportSchemaValidation.test.ts validates exported XML with xmllint.
      # The runner image usually ships it; apt-get update alone costs ~50s, so
      # it only runs as the last resort.
      - run: |
          xmllint --version >/dev/null 2>&1 && exit 0
          sudo apt-get install -y --no-install-recommends libxml2-utils \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils; }
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.checks }}

  package:
    name: package (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # An empty range leaves verify:package on the range the manifest declares
          - react: 19
            range: ""
          - react: 18
            range: "^18"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tarball holds no React of its own, so its contents are checked once
      - if: matrix.react == 19
        run: pnpm test:package
      - run: pnpm verify:package
        env:
          DOCX_EDITOR_REACT_RANGE: ${{ matrix.range }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request only needs its newest commit checked. Every commit on main is
# checked, since the release workflow waits on that result before publishing.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: $/.github/actions/xmllint
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Only the site build resolves the documentation site's own dependencies
      # against each other, so a mismatched pair among them fails here.
      - run: pnpm build:site

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tarball holds no React of its own, so its contents are checked once
      - run: pnpm test:package
      - run: |
          pnpm build
          pnpm pack --pack-destination "${RUNNER_TEMP}"
          echo "DOCX_EDITOR_TARBALL=$(echo "${RUNNER_TEMP}"/*.tgz)" >> "${GITHUB_ENV}"
      # Both majors are verified on this one runner so the suite reads as a
      # single check. Their output would interleave, so each run keeps its own
      # log and both are replayed once they have finished.
      - name: verify the package against each supported React major
        run: |
          verify() {
            DOCX_EDITOR_REACT_RANGE="${2}" pnpm verify:package \
              >"${RUNNER_TEMP}/react-${1}.log" 2>&1
          }
          # An empty range leaves verify:package on the range the manifest declares
          verify 19 "" &
          nineteen=$!
          verify 18 "^18" &
          eighteen=$!
          status=0
          wait "${nineteen}" || status=1
          wait "${eighteen}" || status=1
          for major in 19 18; do
            echo "::group::React ${major}"
            cat "${RUNNER_TEMP}/react-${major}.log"
            echo "::endgroup::"
          done
          exit "${status}"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two runs would race to rewrite the release pull request, and on the publish
# path to claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # A pending changeset means this run assembles the release pull request. None,
  # with a version the registry has never seen, means that pull request has been
  # merged and this run publishes it. Most pushes are neither: `main` sits at a
  # published version for as long as nobody has proposed a release.
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mode
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          echo "pending changesets: ${pending}; version: ${spec}"
          if [ "${pending}" -ne 0 ]; then
            mode=prepare
          elif npm view "${spec}" version >/dev/null 2>&1; then
            mode=idle
          else
            mode=publish
          fi
          echo "mode: ${mode}"
          echo "mode=${mode}" >>"${GITHUB_OUTPUT}"

  # Nothing downstream can catch a bad tarball once npm has it.
  gate:
    needs: mode
    if: needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    # CI splits the same work across two cached jobs at ten minutes each; this
    # one runs both uncached.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # Deliberately uncached: a cache entry written by an earlier run is
      # attacker-reachable input, and this workflow's output is what gets signed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: ./.github/actions/xmllint
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:package

  release:
    needs: [mode, gate]
    # The gate is skipped by design on the release-pull-request path.
    if: >-
      !cancelled() && needs.mode.result == 'success'
      && contains(fromJSON('["publish", "prepare"]'), needs.mode.outputs.mode)
      && contains(fromJSON('["success", "skipped"]'), needs.gate.result)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the version commit, its tag, and the GitHub release
      pull-requests: write # the release pull request
      id-token: write # OIDC, which is how npm authenticates the publish
    steps:
      # The action pushes through the token it is given, not through the
      # checkout credentials. Changesets needs the history to tell released
      # versions from pending ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset:version
          publish-script: pnpm changeset publish
          pr-title: "chore: release"
          commit-message: "chore: release"

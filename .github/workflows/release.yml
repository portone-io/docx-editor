name: Release

# Merging the release pull request is the publish command. CHANGELOG.md changes
# only through `pnpm release:pr`, so nothing else starts this workflow, and
# nothing publishes until that commit's CI run has passed.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

# Two runs would race to claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # A run started by hand publishes main or nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # the wait for this commit's CI run
      contents: write # the tag and the GitHub release
      id-token: write # OIDC, which is how npm authenticates the publish
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry is the record. A version it already holds is a hand-edited
      # CHANGELOG or a rerun of a finished release, and only the steps that are
      # safe to repeat run.
      - id: version
        name: the version main declares, unless npm already has it
        run: |
          version="$(node -p 'require("./package.json").version')"
          spec="@portone/docx-editor@${version}"
          if npm view "${spec}" version >"${RUNNER_TEMP}/view.log" 2>&1; then
            echo "${spec} is already published"
            published=true
          elif grep -q E404 "${RUNNER_TEMP}/view.log"; then
            published=false
          else
            cat "${RUNNER_TEMP}/view.log"
            echo "could not ask npm about ${spec}"
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "published=${published}" >>"${GITHUB_OUTPUT}"
      # Nothing downstream can catch a bad tarball once npm has it, so publishing
      # waits for this commit's whole CI run, package verification and real-browser
      # suite included.
      - name: wait for this commit's CI run
        if: steps.version.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Both workflows start on the same push, so the run can lag the lookup
          for attempt in 1 2 3 4 5 6; do
            run_id=$(gh run list --workflow ci.yml --event push --commit "${SHA}" \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "${run_id}" ] && break
            echo "no CI run for ${SHA} yet (attempt ${attempt})"
            sleep 10
          done
          if [ -z "${run_id}" ]; then
            echo "CI never started for ${SHA}; run it and retry this workflow"
            exit 1
          fi
          gh run watch "${run_id}" --exit-status --interval 15
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # Deliberately uncached: a cache entry written by an earlier run is
      # attacker-reachable input, and this job's output is what gets signed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The tag is made with the GitHub release below, once npm has the version,
      # so a failed publish leaves no tag behind.
      - if: steps.version.outputs.published == 'false'
        run: pnpm changeset publish --no-git-tag
      - name: tag the commit and open the GitHub release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="@portone/docx-editor@${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} already has a release"
            exit 0
          fi
          node scripts/release.mjs notes "${VERSION}" >"${RUNNER_TEMP}/notes.md"
          gh release create "${tag}" --target "${SHA}" --title "${tag}" \
            --notes-file "${RUNNER_TEMP}/notes.md"

  site:
    needs: publish
    permissions:
      contents: write # the verified demo version commit; no npm publishing permission
    uses: $/.github/workflows/site-release.yml
    with:
      version: ${{ needs.publish.outputs.version }}

name: Release

# The release merge stages the tarball after CI. After npm approval, rerun
# this exact run to create the GitHub release and rebuild the demo.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      retry_unstaged:
        description: Retry staging only after confirming no pending version exists on npm
        type: boolean
        default: false

# Two runs would race to claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Stage on npm, then release once public
    # Only main can stage or continue a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # the wait for this commit's CI run
      contents: write # the tag and the GitHub release
      id-token: write # OIDC, which is how npm authenticates the publish
    outputs:
      version: ${{ steps.version.outputs.version }}
      public: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry is the record. A version it already holds is a hand-edited
      # CHANGELOG or a rerun of a finished release, and only the steps that are
      # safe to repeat run.
      - id: version
        name: the version main declares, unless npm already has it
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          RETRY_UNSTAGED: ${{ inputs.retry_unstaged }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          spec="@portone/docx-editor@${version}"
          if npm view "${spec}" version --registry https://registry.npmjs.org >"${RUNNER_TEMP}/view.log" 2>&1; then
            if [ "$(cat "${RUNNER_TEMP}/view.log")" != "${version}" ]; then
              cat "${RUNNER_TEMP}/view.log"
              echo "npm did not return the exact version ${spec}"
              exit 1
            fi
            echo "${spec} is already published"
            published=true
          elif grep -q E404 "${RUNNER_TEMP}/view.log"; then
            published=false
          else
            cat "${RUNNER_TEMP}/view.log"
            echo "could not ask npm about ${spec}"
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "published=${published}" >>"${GITHUB_OUTPUT}"
          stage=false
          if [ "${published}" = false ] && {
            { [ "${EVENT}" = push ] && [ "${ATTEMPT}" = 1 ]; } ||
            { [ "${EVENT}" = workflow_dispatch ] && [ "${ATTEMPT}" = 1 ] && [ "${RETRY_UNSTAGED}" = true ]; }
          }; then
            stage=true
          fi
          echo "stage=${stage}" >>"${GITHUB_OUTPUT}"
      # Nothing downstream can catch a bad tarball once npm has it, so publishing
      # waits for this commit's whole CI run, package verification and real-browser
      # suite included.
      - name: wait for this commit's CI run
        if: steps.version.outputs.stage == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Both workflows start on the same push, so the run can lag the lookup
          for attempt in 1 2 3 4 5 6; do
            run_id=$(gh run list --workflow ci.yml --event push --commit "${SHA}" \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "${run_id}" ] && break
            echo "no CI run for ${SHA} yet (attempt ${attempt})"
            sleep 10
          done
          if [ -z "${run_id}" ]; then
            echo "CI never started for ${SHA}; run it and retry this workflow"
            exit 1
          fi
          gh run watch "${run_id}" --exit-status --interval 15
      - if: steps.version.outputs.stage == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Deliberately uncached: a cache entry written by an earlier run is
      # attacker-reachable input, and this job's output is what gets signed.
      - if: steps.version.outputs.stage == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - if: steps.version.outputs.stage == 'true'
        run: pnpm install --frozen-lockfile
      - name: Stage the package on npm with provenance
        if: steps.version.outputs.stage == 'true'
        run: |
          pack_dir="$(mktemp -d)"
          pnpm pack --pack-destination "${pack_dir}"
          shopt -s nullglob
          tarballs=("${pack_dir}"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one package tarball"
            exit 1
          fi
          npm exec --yes --package=npm@11.21.2 -- npm stage publish "${tarballs[0]}" --tag latest --access public --provenance
      - name: Show the npm approval and continuation steps
        if: steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### @portone/docx-editor@${VERSION} is not public yet"
            echo "Review staging on npmjs.com or with npm stage list. Approve with 2FA, then rerun this exact release run to create the GitHub release and update the site."
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: tag the commit and open the GitHub release from the CHANGELOG entry
        if: steps.version.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="@portone/docx-editor@${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} already has a release"
            exit 0
          fi
          node scripts/release.mjs notes "${VERSION}" >"${RUNNER_TEMP}/notes.md"
          gh release create "${tag}" --target "${SHA}" --title "${tag}" \
            --notes-file "${RUNNER_TEMP}/notes.md"

  site:
    needs: publish
    if: needs.publish.outputs.public == 'true'
    permissions:
      contents: write # the verified demo version commit; no npm publishing permission
    uses: $/.github/workflows/site-release.yml
    with:
      version: ${{ needs.publish.outputs.version }}

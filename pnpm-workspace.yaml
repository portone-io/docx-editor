packages:
  - .
  - demo
  - site

allowBuilds:
  esbuild: true

# On the production branch the site and the demo install the release this repository's own
# workflow has just published. The maturity delay exists to let a compromised third-party
# release be yanked before it is depended on, and it would otherwise hold the live demo a day
# behind every release of the library it demonstrates.
minimumReleaseAgeExclude:
  - '@portone/docx-editor'
